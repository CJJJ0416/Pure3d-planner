input_scope: local_voxel_box
cloud_topic: /faster_lio/cloud_registered
odom_topic: /faster_lio/Odometry
body_frame: body
box_size_m: [6.0, 6.0, 5.0]
box_shift_m: 0.2
max_pose_age_s: 0.5
cache_publish_hz: 2.0
frame: world
source_frame: camera_init
use_sim_time: true
voxel_m: 0.05
max_voxels: 500000
context_mode: stable_core
period_s: 0.25
max_input_age_s: 1.0
max_result_age_s: 2.0
core_size_m: [4.0, 4.0, 3.0]
context_m: 1.0
condition: [0.5, 0.4, 0.2, 0.0]
display_voxel_m: 0.1
display_max_points: 30000
display_hz: 1.0
knn_filter:
  enabled: true
  method: conservative
  k: 16
  alpha: 2.0
  radius_m: 0.15
  min_other_neighbors: 3
  workers: 4
  removed_display_max_points: 2000
network_python: /home/cjh/miniconda3/envs/pure3d-ptv3/bin/python
device: cuda:0
output_root: outputs/entry_local
# Keep the established model as default. Tiny requires its own compatible head.
model: small
models:
  small:
    checkpoint: 'weights/cost/cost_full3d_small_unfrozen_e200_20261114-005204/best.pt'
    expected_epoch: 56
    expected_encoder: utonia_small
  tiny:
    checkpoint: weights/cost/cost_full3d_tiny_unfrozen50_20261113/best.pt
    expected_epoch: 49
    expected_encoder: utonia_tiny

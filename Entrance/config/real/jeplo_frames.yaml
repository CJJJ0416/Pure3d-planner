# Convention: p_parent = R_parent_child * p_child + t_parent_child.
# Real-world JEPLO calibration: datasets/JEPLO/README.md, "Sensor Extrinsics".
# JEPLO publishes LiDAR <- base with Rx(pi), t=[-.275263,.000458,.148998].
# body_to_lidar below is its INVERSE: base <- LiDAR.
# 帧名沿用公共约定；world 在真机上仅用于显示，不参与 Gazebo 锚定。
frames:
  world: world
  map: map
  camera: camera_init
  body: body
  body_reference: base
  imu: livox_imu_link
mount:
  # parameters：显式标定值；数值来自 JEPLO 数据集说明，不是通用真机外参。
  source: parameters
  body_to_lidar:
    translation: [0.275263, 0.000458, 0.148998]  # 机身 <- 雷达平移（米）
    rpy: [3.141592653589793, 0.0, 0.0]           # 机身 <- 雷达旋转：绕 x 转 180°
  # JEPLO's IMU -> LiDAR transform, i.e. LiDAR <- IMU.
  # Faster-LIO's IMU <- LiDAR is generated by inversion, once.
  # 雷达 <- IMU 平移/旋转（米、弧度）。
  lidar_to_imu:
    translation: [0.011, 0.02329, -0.04412]
    rpy: [0.0, 0.0, 0.0]
anchor:
  # Filled per run from the initial IMU mean, without motion-capture input.
  # 每次运行用初始 IMU 均值固定锚定，不依赖动捕。
  source: fixed
  translation: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]

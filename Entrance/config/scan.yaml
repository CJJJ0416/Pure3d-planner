# 导航框架运行配置；在对应 launch 中也可找到此文件路径。
# Usage：ros2 launch Entrance/launch/sim/scan.launch.py flight_type:=4
# A1 workspace adapter; native search/optimization defaults are retained.
scan_planner_node:
  ros__parameters:
    use_sim_time: true

    # FSM：navi_mode 由 launch 的 flight_type 覆盖（1 人工、2 预设航点、3 参考路径、4 cost 引导）。
    fsm.navi_mode: 3
    interface.odom_twist_in_body_frame: true   # 里程计速度已在机体系，不再旋转
    interface.path_transient_local: true       # 路径使用 transient_local，晚加入节点也能收到
    interface.manual_goal_use_z: true          # 人工目标保留 z 值（楼梯场景需要）
    fsm.waypoints: [2.0, 0.0, 0.4, 2.0, 2.0, 0.4]  # 自动模式的候选航点
    fsm.thresh_replan: 1.0                     # 触发重规划的距离阈值（米）
    fsm.thresh_no_replan: 0.1                  # 不重规划的容忍距离（米）
    # Retain the current short target horizon independently of perception size.
    fsm.planning_horizon: 1.5                  # 局部规划时域（米）
    fsm.emergency_time: 1.0                    # 紧急停止后的保持时间（秒）
    fsm.fail_safe: true                        # 规划失败时进入安全状态
    fsm.max_replan_fail_count: 1000            # 连续重规划失败上限

    # 局部栅格地图：分辨率、滑动窗口尺寸与局部更新范围。
    grid_map.resolution: 0.05
    grid_map.sliding_map_size_x: 6.0
    grid_map.sliding_map_size_y: 6.0
    grid_map.sliding_map_size_z: 5.0
    grid_map.local_update_range_x: 3.0
    grid_map.local_update_range_y: 3.0
    grid_map.local_update_range_z: 2.5
    grid_map.map_sliding_en: true              # 地图随体移动（滑动窗口）
    grid_map.map_sliding_thresh: 0.2           # 触发地图滑动的位移阈值（米）
    grid_map.double_cylinder_radius: 0.25      # 双圆柱机身模型半径（米）
    grid_map.double_cylinder_offset: 0.18      # 双圆柱前后偏移（米）
    grid_map.body_height: 0.4                  # 机身参考高度（米）
    grid_map.obstacles_inflation_z_up: 0.1     # 障碍物向上膨胀（米）
    grid_map.obstacles_inflation_z_down: 0.4   # 障碍物向下膨胀（米）
    grid_map.frame_id: world                   # 输入点云所在世界系
    grid_map.sliding_map_frame_id: scan_sliding_map
    grid_map.ground_height: 0.0                # 地面高度（米）
    grid_map.sensor_type: lidar                # 传感器类型：lidar（非深度相机）
    grid_map.cloud_is_world: true              # 点云已在 world 系
    grid_map.need_extrinsic: false             # 无需再做雷达到机身外参变换

    # 深度相机内参/滤波参数；lidar 模式下仅保留兼容字段。
    grid_map.cx: 321.04638671875
    grid_map.cy: 243.44969177246094
    grid_map.fx: 387.229248046875
    grid_map.fy: 387.229248046875
    grid_map.depth_filter_maxdist: 3.0
    grid_map.depth_filter_mindist: 0.3
    grid_map.depth_filter_margin: 1
    grid_map.k_depth_scaling_factor: 1000.0
    grid_map.skip_pixel: 2

    # 占据概率更新：命中/未命中概率、上下限与判定阈值。
    grid_map.p_hit: 0.85
    grid_map.p_miss: 0.30
    grid_map.p_min: 0.12
    grid_map.p_max: 0.98
    grid_map.p_occ: 0.80
    grid_map.max_ray_length: 5.0               # 射线最大长度（米）
    grid_map.vis_height: 0.3                   # 可视化切片高度（米）
    grid_map.show_occ_time: false

    # 轨迹管理器：速度/加速度/加加速度上限与规划时域。
    manager.max_vel: 1.0
    manager.max_acc: 0.5
    manager.max_jerk: 4.0
    manager.control_points_distance: 0.2       # B 样条控制点间距（米）
    manager.feasibility_tolerance: 0.5
    manager.planning_horizon: 1.5              # 规划时域（米）
    manager.replan_timeout_s: 0.5              # 重规划超时（秒）

    # B 样条优化权重与约束：平滑、碰撞、可行性、拟合项。
    optimization.lambda_smooth: 1.0
    optimization.lambda_collision: 1.0
    optimization.lambda_feasibility: 0.1
    optimization.lambda_fitness: 1.0
    optimization.dist0: 0.2                    # 初始控制点间距（米）
    optimization.max_vel: 1.0
    optimization.max_acc: 0.5
    optimization.order: 3                      # 样条阶数

# 闭环轨迹跟踪：前视时间、航向误差阈值与位置/航向增益。
closed_loop_controller:
  ros__parameters:
    use_sim_time: true
    time_forward: 0.8                          # 前视时间（秒）
    heading_error_threshold: 0.8               # 航向误差阈值（弧度）
    kp_pos: 0.8                                # 位置比例增益
    kp_yaw: 1.5                                # 航向比例增益
    max_vx: 1.0                                # 最大前进速度（m/s）
    max_vy: 0.25                               # 最大侧向速度（m/s）
    reference_speed_acceleration: 0.5          # 参考速度生成用的加速度（m/s²）
    reference_speed_reaction_time: 0.5         # 参考速度反应时间（秒）
    reference_speed_stop_margin: 0.15          # 终点减速裕量（米）
    reference_speed_preview_time: 3.0          # 参考速度预览时间（秒）
    reference_height_tolerance: 0.5            # 高度容差（米）
    reference_body_height: 0.4                 # 参考机身高度（米）
    max_vyaw: 1.0                              # 最大偏航角速度（rad/s）
    finish_dist: 0.15                          # 到达判定距离（米）
# 模式 4 + light 的样条跟踪服务器：最大跟踪加速度（m/s²）。
ego_local_trajectory_server:
  ros__parameters:
    interface.max_tracking_acc: 0.70
# 工作区桥接：把外部里程计/点云/路径接入 /scan，并控制路径采样与高度处理。
scan_workspace_bridge:
  ros__parameters:
    use_sim_time: true
    planning_frame: world                      # 规划坐标系
    sensor_frame: laser_livox                  # 雷达坐标系
    # PCT Path already has body planning height; cancel SCAN's terrain-path height addition.
    path_body_height: 0.4                      # 参考路径的机身高度（米）
    # Same XYZ point spacing as quadruped EGO; retain the exact final pose.
    path_sample_distance: 0.8                  # 路径采样间距（米），保留精确终点

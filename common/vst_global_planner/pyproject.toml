[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vst-global-planner"
version = "0.1.0"
description = "PTv3 and Tomography supervised navigation: explicit map interface"
requires-python = ">=3.10"
dependencies = ["numpy", "trimesh", "manifold3d>=3.5.4,<4", "matplotlib", "plotly"]

[tool.setuptools.packages.find]
where = ["src"]

